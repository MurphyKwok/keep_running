name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-v*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled application snapshot
        run: pnpm android:prepare

      - name: Verify Android snapshot
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -q '/assets/public/assets/' android/app/src/main/assets/public/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and assemble APK
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK package contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'assets/public/index.html'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: keep-running-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
