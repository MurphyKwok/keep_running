name: Sync Mini Program Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: miniprogram-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh bundled data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore synchronized data
        uses: actions/cache/restore@v4
        with:
          path: |
            activities
            assets
            GPX_OUT
            TCX_OUT
            FIT_OUT
            Workouts
            run_page/data.db
            src/static/activities.json
            imported.json
          key: track_data-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            track_data-${{ github.sha }}-
            track_data-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh local data from Keep
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: |
          python run_page/keep_sync.py "$KEEP_MOBILE" "$KEEP_PASSWORD" --with-gpx

      - name: Remove runs deleted in Keep
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
        run: |
          python run_page/keep_prune.py --apply

      - name: Regenerate mini program bundle
        run: python run_page/generate_miniprogram_data.py

      - name: Commit refreshed data
        id: commit
        run: |
          if git diff --quiet -- src/static/activities.json miniprogram/data/activities.js; then
            echo "Mini program data is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/activities.json miniprogram/data/activities.js
          git commit -m "Sync mini program data from Keep"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-page:
    name: Publish refreshed Running Page
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/gh-pages.yml
    with:
      save_data_in_github_cache: false
      data_cache_prefix: track_data
    secrets: inherit
